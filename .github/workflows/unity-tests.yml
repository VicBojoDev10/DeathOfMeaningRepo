name: Tests unitarios

on:
  pull_request:
    branches: [dev, main]

jobs:
  editmode:
    name: EditMode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # La carpeta Library pesa varios GB y tarda mucho en regenerarse.
      # Sin cache, cada corrida del CI se lleva 10-15 minutos.
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Correr tests de EditMode
        uses: game-ci/unity-test-runner@v4
        env:
          #FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          artifactsPath: resultados-tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Resultados EditMode

      - name: Publicar resultados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultados-tests
          path: resultados-tests
