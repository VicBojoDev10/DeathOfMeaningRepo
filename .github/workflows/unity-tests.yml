name: Tests unitarios

on:
  pull_request:
    branches: [dev, main]

jobs:
  editmode:
    name: EditMode
    runs-on: ubuntu-latest
    steps:
      # Sin la licencia de Unity (secret UNITY_LICENSE) el runner no puede
      # activar el editor y el job falla. Mientras el secret no exista, se
      # omiten los tests para NO bloquear el merge; se activan solos al
      # configurarlo. El aviso de deprecacion de Node 20 es solo un warning
      # del runner de game-ci y no afecta este resultado.
      - name: Verificar licencia de Unity
        id: lic
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -n "$UNITY_LICENSE" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::UNITY_LICENSE no configurado. Se omiten los tests de Unity hasta agregar el secret."
          fi

      - uses: actions/checkout@v4
        if: steps.lic.outputs.present == 'true'
        with:
          lfs: true

      # La carpeta Library pesa varios GB y tarda mucho en regenerarse.
      # Sin cache, cada corrida del CI se lleva 10-15 minutos.
      # El proyecto de Unity vive en la subcarpeta The_Death_Of_Meaning/,
      # no en la raiz del repo. Las rutas del cache y projectPath lo reflejan.
      - uses: actions/cache@v4
        if: steps.lic.outputs.present == 'true'
        with:
          path: The_Death_Of_Meaning/Library
          key: Library-${{ hashFiles('The_Death_Of_Meaning/Assets/**', 'The_Death_Of_Meaning/Packages/**', 'The_Death_Of_Meaning/ProjectSettings/**') }}
          restore-keys: |
            Library-

      - name: Correr tests de EditMode
        if: steps.lic.outputs.present == 'true'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: The_Death_Of_Meaning
          testMode: EditMode
          artifactsPath: resultados-tests
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: Resultados EditMode

      - name: Publicar resultados
        if: always() && steps.lic.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: resultados-tests
          path: resultados-tests
