name: TW Compliance Review (manual)

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número del PR a revisar"
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refs/pull/${{ github.event.inputs.pr_number }}/head
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/tw-compliance-review ${{ github.event.inputs.pr_number }}"
          claude_args: '--allowedTools "Bash,mcp__github_inline_comment__create_inline_comment" --model claude-sonnet-5'
          show_full_output: "true"
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_SITE: tdom.atlassian.net
